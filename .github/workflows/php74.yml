name: PHP 7.4 Compatibility

# Builds the Rector-downgraded release package (same as `downgrade.yml`) and checks that it
# actually works on PHP 7.4: every PHP file lints, and the plugin activates and renders
# wp-login.php and its admin pages on a real WordPress install without fatal errors.
on:
  pull_request:
    branches-ignore:
      - main
      - master
      - translate/*
  workflow_dispatch:

permissions:
  contents: read

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-php74.yml

  test:
    name: Test (PHP 7.4, WP ${{ matrix.wp-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 6.4 is the "Requires at least" the release build declares.
        wp-version: [ '6.4', 'latest' ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - "3306:3306"
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=10s --health-retries=10
    env:
      SITE_URL: http://127.0.0.1:8080
      WP_DIR: ${{ github.workspace }}/wordpress
      PLUGIN_DIR: ${{ github.workspace }}/wordpress/wp-content/plugins/custom-login

    steps:
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          extensions: curl, mysqli, zip
          ini-values: error_reporting=E_ALL, display_errors=Off, log_errors=On
          tools: wp-cli

      - name: Ensure WP-CLI
        run: |
          # setup-php's wp-cli download occasionally fails; fall back to the official phar.
          if ! command -v wp > /dev/null; then
            curl -sSfL --retry 5 --retry-all-errors -o wp-cli.phar \
              https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            sudo install -m 0755 wp-cli.phar /usr/local/bin/wp
          fi
          wp --info

      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: custom-login-php74
          path: plugin-build/

      - name: Unzip package
        run: |
          mkdir -p package
          unzip -q plugin-build/custom-login-php74.zip -d package
          # `composer archive` may or may not wrap the files in a top-level folder.
          main=$(find package -maxdepth 2 -name custom-login.php | head -n 1)
          if [ -z "$main" ]; then
            echo "::error::custom-login.php not found in the package"
            exit 1
          fi
          echo "PACKAGE_DIR=$(dirname "$main")" >> "$GITHUB_ENV"

      - name: Check plugin header
        run: |
          grep -q '\* Requires PHP: 7.4' "$PACKAGE_DIR/custom-login.php"
          grep -q '\* Requires at least: 6.4' "$PACKAGE_DIR/custom-login.php"

      - name: Lint all PHP files with PHP 7.4
        run: |
          php -v
          # Bundled packages' own test suites are never loaded by WordPress (and aren't downgraded), skip them.
          # `php -l` exits 255 on a parse error, which would make xargs stop early, so always exit 0.
          find "$PACKAGE_DIR" -type f -name '*.php' -not -path '*/vendor/*/tests/*' -not -path '*/vendor/*/Tests/*' -print0 \
            | xargs -0 -n 1 -P 4 sh -c 'php -d display_errors=1 -l "$0" 2>&1; exit 0' > lint.log
          if grep -v '^No syntax errors detected' lint.log | grep -q .; then
            grep -v '^No syntax errors detected' lint.log
            echo "::error::PHP 7.4 syntax errors in the downgraded package"
            exit 1
          fi
          echo "Linted $(wc -l < lint.log) files"

      - name: Install WordPress ${{ matrix.wp-version }}
        run: |
          mkdir -p "$WP_DIR" && cd "$WP_DIR"
          wp core download --version=${{ matrix.wp-version }}
          wp config create --dbname=wordpress --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1:${{ job.services.mysql.ports['3306'] }} --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          # Keep the tested version fixed (running cron below would otherwise auto-update to the latest minor).
          wp config set AUTOMATIC_UPDATER_DISABLED true --raw
          wp config set WP_AUTO_UPDATE_CORE false --raw
          wp core install --url="$SITE_URL" --title="PHP 7.4 CI" \
            --admin_user=admin --admin_password=password --admin_email=ci@example.com --skip-email
          # Older versions can be left asking for a database update, which redirects every admin page.
          wp core update-db
          wp core version

      - name: Install & activate plugin
        run: |
          cp -R "$PACKAGE_DIR" "$PLUGIN_DIR"
          cd "$WP_DIR"
          wp plugin activate custom-login
          wp plugin list --name=custom-login --field=status | grep -qx active
          # Exercise the design settings when building the login stylesheet.
          wp option update custom_login_design \
            '{"label_color":"#ff0000","login_form_width":"400","custom_html":"<p id=\"ci-html\">CI</p>"}' \
            --format=json
          wp cron event run --due-now

      - name: Start PHP 7.4 web server
        run: |
          php -S 127.0.0.1:8080 -t "$WP_DIR" > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null "$SITE_URL/wp-login.php" && exit 0
            sleep 1
          done
          echo "::error::Web server did not start"
          exit 1

      - name: Request pages
        run: |
          fetch() {
            # fetch <path> <output file> [extra curl args...]
            local path=$1 out=$2; shift 2
            local result code url
            result=$(curl -s -L -o "$out" -w '%{http_code} %{url_effective}' -b cookies.txt -c cookies.txt "$@" "$SITE_URL$path")
            code=${result%% *}
            url=${result#* }
            echo "$path -> HTTP $code ($url)"
            if [ "$code" != "200" ] || grep -qi 'critical error\|Fatal error' "$out"; then
              echo "::error::$path failed (HTTP $code)"
              cat "$out"
              exit 1
            fi
            # Admin pages must not end up on the database upgrade screen or back at the login form.
            case "$path" in
              /wp-admin/*)
                if [[ "$url" == *upgrade.php* || "$url" == *wp-login.php* ]]; then
                  echo "::error::$path was redirected to $url"
                  (cd "$WP_DIR" && wp core version --extra && wp option get db_version) || true
                  sed 's/<[^>]*>//g' "$out" | grep -v '^[[:space:]]*$' | head -n 40
                  exit 1
                fi
                ;;
            esac
          }

          # Login screen: the plugin's styles and footer HTML must be rendered.
          fetch /wp-login.php login.html
          grep -q 'name="generator" content="Custom Login' login.html
          grep -q 'color: #ff0000' login.html
          grep -q 'id="ci-html"' login.html

          # Log in and load the admin pages the plugin adds or hooks into.
          fetch /wp-login.php login-post.html \
            --data-urlencode 'log=admin' --data-urlencode 'pwd=password' \
            --data-urlencode 'testcookie=1' --data-urlencode "redirect_to=$SITE_URL/wp-admin/"
          fetch /wp-admin/ dashboard.html
          fetch '/wp-admin/options-general.php?page=custom-login' settings.html
          grep -q 'custom_login_design' settings.html
          fetch '/wp-admin/options-general.php?page=custom-login/extensions' extensions.html
          fetch /wp-admin/plugins.php plugins.html

      - name: Check for PHP errors
        if: always()
        run: |
          log="$WP_DIR/wp-content/debug.log"
          for f in "$log" server.log; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              cat "$f"
              echo "::endgroup::"
            fi
          done
          if cat "$log" server.log 2>/dev/null | grep -E 'PHP (Fatal error|Parse error)|Uncaught' | grep -q .; then
            echo "::error::PHP fatal errors were logged"
            exit 1
          fi
          # Warnings/notices from the plugin's own code (not core or bundled vendors) also fail the build.
          if [ -f "$log" ] && grep -E 'PHP (Warning|Notice|Deprecated)' "$log" | grep 'plugins/custom-login/' | grep -v '/vendor/' | grep -q .; then
            echo "::error::PHP warnings/notices from Custom Login were logged"
            exit 1
          fi
